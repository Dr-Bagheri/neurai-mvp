[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurai-server"
version = "0.1.0"
description = "NeurAI on-premise engine — Persian-first meeting intelligence server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "argon2-cffi>=23.1",
    # Encryption at rest is default-on (D4, Phase 1 exit criterion):
    "cryptography>=42.0",       # audio files (AES-256-CTR)
    "sqlcipher3-wheels>=0.5",   # SQLite database (SQLCipher)
]

[project.optional-dependencies]
# Heavy ML deps are opt-in; the server runs (with fake/degraded engines) without them.
asr = ["faster-whisper>=1.0"]
export = ["python-docx>=1.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
neurai-server = "neurai.main:run"

[tool.setuptools.packages.find]
include = ["neurai*"]

[tool.setuptools.package-data]
# The migration SQL files must ship in the wheel — a fresh install has no
# tables without them (D4: numbered migrations are the only schema source).
neurai = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
